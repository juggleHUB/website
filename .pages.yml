# Pages CMS — edits these Git-tracked JSON files and uploads images to public/images.
# German and English live in the same file; edit both locale sections as needed.
media:
  input: public/images
  output: /images
  categories:
  - image
  rename: safe
settings:
  content:
    merge: true
components:
  home_locale:
    type: object
    fields:
    - name: hero_headline
      label: Hero Headline
      type: string
    - name: hero_image
      label: Hero Image
      type: image
      options:
        path: public/images/pages/home
    - name: hero_subtext
      label: Hero Subtext
      type: text
    - name: hero_cta_label
      label: Hero CTA Label
      type: string
    - name: hero_cta_url
      label: Hero CTA URL
      type: string
    - name: welcome_title
      label: Welcome Title
      type: string
    - name: welcome_text
      label: Welcome Text
      type: text
    - name: feature_cards
      label: Feature Cards
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{title}'
      fields:
      - name: title
        label: Title
        type: string
      - name: text
        label: Text
        type: text
      - name: url
        label: URL
        type: string
      - name: image
        label: Image
        type: image
        options:
          path: public/images/icons
    - name: carousel_items
